# DEVINE-style smoke — Dept A config sweep V3 tau intermediate
# Hypothesis: smoke v3 val_bias overshot from -0.796 (raw) to +0.495 (corrected).
# The τ asymmetric 0.6/0.4 (penalty stronger on obs <= pred branch) over-corrects
# upward. Try intermediate τ 0.55/0.45 to reduce bias overshoot while keeping
# some asymmetry (the surrogate slope 0.59 does underestimate strong winds).

# ── Data ─────────────────────────────────────────────────────────────────────
pairings_parquet: /home/maitreje/dsw/data/inference/noaa_winter2223.parquet
era5_store: /home/maitreje/dsw/data/raw/era5_europe_winter2223.zarr
dem: /home/maitreje/dsw/data/raw/srtm_tiles/
worldcover: /home/maitreje/dsw/data/raw/worldcover_esa/

# ── Frozen surrogate v2 ──────────────────────────────────────────────────────
surrogate_checkpoint: /home/maitreje/dsw/data/models/surrogate_v2_vit_base_resid_s4_geo_agl100_k24_surface/best.pt
surrogate_preset: base
norm_yaml: /scratch/maitreje/dsw/complex_terrain_v1/manifests/dataset_v2_norm.yaml
target_agl_levels: agl_0_100_24
n_pressure_levels: 10

# ── Splits (FROZEN — must equal v3 to keep Δmae comparable) ─────────────────
val_frac: 0.20
seed: 42
exclude_substrings: ["perdigao"]
max_stations: 200
max_train_pairings: 25000
max_val_pairings: 6000

# ── ANN architecture (DEVINE Table 2 ANN_speed) ──────────────────────────────
topo_dim: 8
hidden_units: [50, 10]
dropout: 0.25

# ── Training (V3 = τ intermediate) ───────────────────────────────────────────
epochs: 5
batch_size: 4
lr: 0.001
lr_schedule: constant
tau_under: 0.55
tau_over: 0.45

num_workers: 2
n_prep_workers: 4
max_era5_delta_h: 3.5
overwrite_cache: false

# ── I/O ──────────────────────────────────────────────────────────────────────
output_dir: /home/maitreje/dsw/data/models/surrogate_v2_devine_A_V3_tau_sym
cache_dir: /scratch/maitreje/dsw/phase_H_prime_smoke_cache
device: cuda
