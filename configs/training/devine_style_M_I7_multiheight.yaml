# DEVINE-style M_I7 palier A — MULTI-HEIGHT fine-tune of the M_I5 encoder model.
# Base = devine_style_M_I5_encoder.yaml (arch + regime loss UNCHANGED). New:
#   1. extra_parquets: multiheight_towers_v1.parquet (ICOS 5 towers JJA2020 +
#      Perdigão 48 masts × levels IOP2017), merged with the 609k 10 m dataset.
#      Per-pop sampling weights via WeightedRandomSampler: tower_icos 4.0
#      (only ~29k rows, the signal we need at 40-100 m), perdigao_mast 1.5
#      (calm-dominated — must not swamp), base 10 m dataset 1.0.
#   2. use_calm_gate: multiplicative sigmoid gate on the ANN delta driven by
#      the ERA5 10 m speed (v0 init 2.5 m/s) — shuts the correction off in calm.
#   3. init_from: fine-tune from M_I5 best.pt (gate params start at init).
# height_obs > 100 m rows (7,147: ICOS 120/131/180) are filtered by the loader
# (reserved for v3 deep-crop). Per-sample k_obs = nearest agl_0_100_24 level.
#
# CACHE: reuses the M_I3/M_I5 production cache for the 600k 10 m pairings.
# NEW multiheight pairings materialise on first run into the same cache dir
# (~60k unique tower×hour grids — heights of one tower share one grid.zarr).

# ── Data ─────────────────────────────────────────────────────────────────────
pairings_parquet: /home/maitreje/dsw/data/inference/combined_steep_plain_v2.parquet
base_weight: 1.0
extra_parquets:
  - path: /home/maitreje/dsw/data/inference/multiheight_towers_v1.parquet
    weight: 1.0
    pop_weights:
      tower_icos: 4.0
      perdigao_mast: 1.5
    season_era5_stores:
      jja2020: /home/maitreje/dsw/data/raw/era5_hourly_jja2020_eu_wide.zarr
      iop2017: /home/maitreje/dsw/data/raw/era5_europe_spring2017_v2.zarr
era5_store: /home/maitreje/dsw/data/raw/era5_europe_hourly_jja2023_med.zarr
dem: /home/maitreje/dsw/data/raw/srtm_tiles/
worldcover: /home/maitreje/dsw/data/raw/worldcover_esa/

# ── Frozen surrogate v2 ──────────────────────────────────────────────────────
surrogate_checkpoint: /home/maitreje/dsw/data/models/surrogate_v2_vit_base_resid_s4_geo_agl100_k24_surface/best.pt
surrogate_preset: base
norm_yaml: /scratch/maitreje/dsw/complex_terrain_v1/manifests/dataset_v2_norm.yaml
target_agl_levels: agl_0_100_24
n_pressure_levels: 10

# ── Splits ───────────────────────────────────────────────────────────────────
# exclude_substrings EMPTIED vs M_I5: palier A deliberately TRAINS on the
# Perdigão masts (pop perdigao_mast). The watertight split groups all heights
# of one physical tower (station ids <tower>_hNNN) so no height leakage.
val_frac: 0.20
seed: 42
exclude_substrings: []

# ── ANN architecture (M_I5 encoder arch UNCHANGED + calm gate) ───────────────
topo_dim: 12
enable_phys_features: true
hidden_units: [50, 10]
dropout: 0.25
use_terrain_encoder: true
terrain_latent_dim: 48
terrain_in_channels: 4
use_calm_gate: true
gate_v0_init: 2.5
gate_s_init: 1.0

# ── Fine-tune init ───────────────────────────────────────────────────────────
init_from: /home/maitreje/dsw/data/models/surrogate_v2_devine_M_I5_encoder/best.pt

# ── Loss (M_I5b REGIME-AWARE — UNCHANGED) ────────────────────────────────────
loss_mode: regime
tau_under: 0.6
tau_over: 0.4
calm_threshold: 3.0
calm_width: 1.5
calm_over_penalty: 2.0
weight_floor: 1.0
calm_strat_thr: 3.0

# ── Training (fine-tune: 4 epochs ≈ 20 h on ~640k rows; 24 h walltime) ───────
epochs: 4
batch_size: 4
lr: 5.0e-4
grad_clip_norm: 1.0
num_workers: 4
n_prep_workers: 8
max_era5_delta_h: 3.5
overwrite_cache: false

# ── I/O ──────────────────────────────────────────────────────────────────────
output_dir: /home/maitreje/dsw/data/models/surrogate_v2_devine_M_I7_multiheight
cache_dir: /scratch/maitreje/dsw/phase_H_prime_M_I3_combined_cache
device: cuda
