mission: M_H1
stage: E.1
strategy:
  id: A
  name: sparse_additive_token_embedding
  rationale: Inherited frozen from M_H0_smoke. The sparse gated MLP updates only the patch token containing the sampled pixel, mask=0 path is an exact no-op vs baseline. Strategy not pivoted here — only the training horizon is extended.
paths:
  data_dir: /scratch/maitreje/dsw/training_v2
  splits_yaml: /scratch/maitreje/dsw/complex_terrain_v1/manifests/dataset_v2_splits.yaml
  norm_yaml: /scratch/maitreje/dsw/complex_terrain_v1/manifests/dataset_v2_norm.yaml
  resume: $HOME/dsw/data/models/surrogate_v2_e2_stage1_smoke/best.pt
  out_dir: $HOME/dsw/data/models/surrogate_v2_e2_stage1
model:
  preset: base
  terrain_in_channels: 4
  geo_channels: 2
  era5_flat_dim: 408
  target_agl_levels: agl_0_100_24
dataset:
  use_geo: true
  include_slopes: true
  use_residual: true
  residual_baseline_mode: surface
  obs_dropout: 0.5
  obs_height_m: 10.0
  max_train_cases: null  # full train split 6567 cases
  max_val_cases: null    # full val split 1300 cases
training:
  epochs: 30
  batch_size: 4
  num_workers: 4
  lr: 5.0e-5
  weight_decay: 0.05
  warmup_epochs: 1
  loss_type: s4
  w_amp: 0.1
  w_div: 0.05
  agl_weight_alpha: 2.0
  agl_weight_height: 50.0
  checkpoint_every: 5
toggle_monitor:
  enabled: true
  epochs: "5,10,15,20,25,30"
  n_cases: 20
  warn_epoch: 10
  warn_threshold: 1.0e-4
