# ABLATION A, CONTINUATION (2026-09-19): 4 more epochs from A's best.pt (epoch 3 was
# still improving; M_I8 itself was fine-tuned from M_I7b, so 4 epochs from scratch
# under-trains A).  Everything else identical to ablation_ann_only_A_terrain_cnn.yaml.
# Same data, split, loss, optimiser, epochs and selection criterion as M_I8
# (devine_style_M_I8_multiheight_v3.yaml), but NO surrogate: ANNDirect takes the
# same inputs as the M_I8 correction network (ERA5 3x3 x 10 levels + surface, the
# 12 topo/physics features, the 4-channel 180x180 terrain patch through the same
# CNN encoder) plus the target height AGL, and predicts the (u, v) residual to
# ERA5 u10/v10 at the station directly.  "raw" in the logs = plain ERA5 10 m.
# Differences vs M_I8 that are deliberate: no init_from (M_I8 was fine-tuned from
# M_I7b, which has no equivalent here) and use_calm_gate irrelevant.
# Arm B (relief metrics only, no CNN) will follow the adversarial review.

ann_only: true

# ── Data (identical to M_I8) ─────────────────────────────────────────────────
pairings_parquet: /home/maitreje/dsw/data/inference/combined_steep_plain_v2.parquet
base_weight: 1.0
extra_parquets:
  - path: /home/maitreje/dsw/data/inference/multiheight_towers_v1.parquet
    weight: 1.0
    pop_weights:
      tower_icos: 4.0
      perdigao_mast: 1.5
    season_era5_stores:
      jja2020: /home/maitreje/dsw/data/raw/era5_hourly_jja2020_eu_wide.zarr
      iop2017: /home/maitreje/dsw/data/raw/era5_europe_spring2017_v2.zarr
era5_store: /home/maitreje/dsw/data/raw/era5_europe_hourly_jja2023_med.zarr
dem: /home/maitreje/dsw/data/raw/srtm_tiles/
worldcover: /home/maitreje/dsw/data/raw/worldcover_esa/

# ── Surrogate: NOT built (ann_only), keys kept so era5 layout / levels match ─
surrogate_checkpoint: /home/maitreje/dsw/data/models/surrogate_v3_vit_base_agl200_k32/best.pt
surrogate_preset: base
norm_yaml: /scratch/maitreje/dsw/complex_terrain_v1/manifests/dataset_v2_norm.yaml
target_agl_levels: agl_0_200_32
n_pressure_levels: 10

# ── Splits (identical to M_I8) ───────────────────────────────────────────────
val_frac: 0.20
seed: 42
exclude_substrings: []

# ── Network (identical inputs to M_I8's ANN) ─────────────────────────────────
topo_dim: 12
enable_phys_features: true
hidden_units: [50, 10]
dropout: 0.25
use_terrain_encoder: true
terrain_latent_dim: 48
terrain_in_channels: 4
use_calm_gate: false

# ── Model-selection criterion (identical) ────────────────────────────────────
height_weight_mode: protect10m
height_weight_10m: 0.5

# ── Loss (identical) ─────────────────────────────────────────────────────────
loss_mode: regime
tau_under: 0.6
tau_over: 0.4
calm_threshold: 3.0
calm_width: 1.5
calm_over_penalty: 2.0
weight_floor: 1.0
calm_strat_thr: 3.0

# ── Training (identical) ─────────────────────────────────────────────────────
epochs: 4
batch_size: 4
lr: 5.0e-4
grad_clip_norm: 1.0
num_workers: 12
n_prep_workers: 16
max_era5_delta_h: 3.5
overwrite_cache: false

# ── I/O ──────────────────────────────────────────────────────────────────────
output_dir: /home/maitreje/dsw/data/models/ablation_ann_only_A_terrain_cnn_cont
init_from: /home/maitreje/dsw/data/models/ablation_ann_only_A_terrain_cnn/best.pt
cache_dir: /scratch/maitreje/dsw/phase_H_prime_M_I3_combined_cache
device: cpu  # tiny model: data loading dominates, CPU queue is shorter
