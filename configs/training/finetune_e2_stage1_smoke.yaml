mission: M_H0_smoke
stage: E.1
strategy:
  id: A
  name: sparse_additive_token_embedding
  rationale: The sparse gated MLP updates only the patch token containing the sampled pixel, preserving terrain channels and era5_flat_dim while mask=0 is an exact no-op.
paths:
  data_dir: /scratch/maitreje/dsw/training_v2
  splits_yaml: /scratch/maitreje/dsw/complex_terrain_v1/manifests/dataset_v2_splits.yaml
  norm_yaml: /scratch/maitreje/dsw/complex_terrain_v1/manifests/dataset_v2_norm.yaml
  resume: $HOME/dsw/data/models/surrogate_v2_vit_base_resid_s4_geo_agl100_k24_surface/best.pt
  out_dir: $HOME/dsw/data/models/surrogate_v2_e2_stage1_smoke
model:
  preset: base
  terrain_in_channels: 4
  geo_channels: 2
  era5_flat_dim: 408
  target_agl_levels: agl_0_100_24
dataset:
  use_geo: true
  include_slopes: true
  use_residual: true
  residual_baseline_mode: surface
  obs_dropout: 0.5
  obs_height_m: 10.0
  max_train_cases: 8
  max_val_cases: 4
training:
  epochs: 1
  batch_size: 2
  num_workers: 0
  lr: 5.0e-5
  weight_decay: 0.05
  loss_type: s4
  w_amp: 0.1
  w_div: 0.05
  agl_weight_alpha: 2.0
  agl_weight_height: 50.0
