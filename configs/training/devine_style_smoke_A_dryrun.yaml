# DEVINE-style smoke — Dept A DRY-RUN config
# Exercises ALL new knobs (warmup_cosine + grad_clip + tau override) in one
# tiny run on Aqua H100. 2 stations, 4 train + 2 val pairings, 1 epoch.
# Expected wall: ~2-3 min including cache lookup (cache reused).
# Purpose: catch any code bug introduced by the 3 new knobs BEFORE qsub-ing
# the 4 full smoke variants (cf. department.md lesson).

# ── Data ─────────────────────────────────────────────────────────────────────
pairings_parquet: /home/maitreje/dsw/data/inference/noaa_winter2223.parquet
era5_store: /home/maitreje/dsw/data/raw/era5_europe_winter2223.zarr
dem: /home/maitreje/dsw/data/raw/srtm_tiles/
worldcover: /home/maitreje/dsw/data/raw/worldcover_esa/

# ── Frozen surrogate v2 ──────────────────────────────────────────────────────
surrogate_checkpoint: /home/maitreje/dsw/data/models/surrogate_v2_vit_base_resid_s4_geo_agl100_k24_surface/best.pt
surrogate_preset: base
norm_yaml: /scratch/maitreje/dsw/complex_terrain_v1/manifests/dataset_v2_norm.yaml
target_agl_levels: agl_0_100_24
n_pressure_levels: 10

# ── Splits (tiny) ────────────────────────────────────────────────────────────
val_frac: 0.20
seed: 42
exclude_substrings: ["perdigao"]
max_stations: 2
max_train_pairings: 4
max_val_pairings: 2

# ── ANN architecture ─────────────────────────────────────────────────────────
topo_dim: 8
hidden_units: [50, 10]
dropout: 0.25

# ── Training (exercise all 3 new knobs) ──────────────────────────────────────
epochs: 1
batch_size: 2
lr: 0.001
lr_schedule: warmup_cosine
warmup_epochs: 1
lr_min_warmup: 0.0001
lr_final: 0.0001
grad_clip_norm: 1.0
tau_under: 0.55
tau_over: 0.45

num_workers: 0
n_prep_workers: 2
max_era5_delta_h: 3.5
overwrite_cache: false

# ── I/O ──────────────────────────────────────────────────────────────────────
output_dir: /home/maitreje/dsw/data/models/surrogate_v2_devine_A_dryrun
cache_dir: /scratch/maitreje/dsw/phase_H_prime_smoke_cache
device: cuda
