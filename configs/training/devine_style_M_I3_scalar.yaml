# DEVINE-style M_I3 SCALAR (M_H'1f arch) — COMBINED steep + plain dataset
# Arch: topo_dim=12 scalar physical features, NO terrain encoder (M_H'1f).
# Dataset = COMBINED combined_steep_plain_v2.parquet
#   steep 344,615 (279 EU-Med steep stations, Alps+Apennines, 4 seasons)
#   + plain/prod 264,773 (250 NOAA stations, 4 seasons) = 609,388 pairings.
# Stations are disjoint (steep∩prod=0) → 529 unique stations total.
#
# CACHE PRECONDITION (gatekeeper): this run uses overwrite_cache=false and a
# SHARED cache_dir that MUST already hold every combined grid.zarr. The 4 steep
# seasons must be pre-materialised with their PER-SEASON ERA5 store (see the
# materialise PBS), because a single `era5_store` cannot cover 4 disjoint
# seasonal windows. When the cache is fully populated, `era5_store` below is
# never read (cache-hit path skips build_one) → its value is only a placeholder
# for the loader's constructor signature.

# ── Data ─────────────────────────────────────────────────────────────────────
pairings_parquet: /home/maitreje/dsw/data/inference/combined_steep_plain_v2.parquet
# Placeholder store (NOT read when cache is fully pre-materialised).
era5_store: /home/maitreje/dsw/data/raw/era5_europe_hourly_jja2023_med.zarr
dem: /home/maitreje/dsw/data/raw/srtm_tiles/
worldcover: /home/maitreje/dsw/data/raw/worldcover_esa/

# ── Frozen surrogate v2 ──────────────────────────────────────────────────────
surrogate_checkpoint: /home/maitreje/dsw/data/models/surrogate_v2_vit_base_resid_s4_geo_agl100_k24_surface/best.pt
surrogate_preset: base
norm_yaml: /scratch/maitreje/dsw/complex_terrain_v1/manifests/dataset_v2_norm.yaml
target_agl_levels: agl_0_100_24
n_pressure_levels: 10

# ── Splits (watertight, station-disjoint) ────────────────────────────────────
val_frac: 0.20
seed: 42
exclude_substrings: ["perdigao"]   # Perdigao IOP held out as separate spatial eval
# Full combined dataset (no max_stations / max_pairings)

# ── ANN architecture (M_H'1f scalar — DEVINE Table 2 + phys features) ─────────
topo_dim: 12
enable_phys_features: true
hidden_units: [50, 10]
dropout: 0.25
# use_terrain_encoder: false (default) — this is the scalar-feature arm

# ── Training (M_H'1f winner config: lr=5e-4 + grad_clip=1.0) ──────────────────
epochs: 8
batch_size: 4
lr: 5.0e-4
grad_clip_norm: 1.0
num_workers: 4
n_prep_workers: 8
max_era5_delta_h: 3.5
overwrite_cache: false            # REQUIRES pre-materialised shared cache

# ── I/O ──────────────────────────────────────────────────────────────────────
output_dir: /home/maitreje/dsw/data/models/surrogate_v2_devine_M_I3_scalar
cache_dir: /scratch/maitreje/dsw/phase_H_prime_M_I3_combined_cache
device: cuda
