# SMOKE — M_I5b REGIME-AWARE loss (encoder M_H'1g arch).
# Goal: 1 epoch, small station subset, confirm (a) loss decreases, (b) the
# LOW-WIND bias drops vs the M_I3 encoder baseline (the key M_I5b metric),
# (c) the high-wind gain is preserved. Encoder arch UNCHANGED vs M_I3.
#
# CACHE: reuse the production combined cache, overwrite_cache=false. NO
# re-materialise — only a station subset of the already-cached pairings is read.

# ── Data (same combined dataset + cache as M_I3 production) ───────────────────
pairings_parquet: /home/maitreje/dsw/data/inference/combined_steep_plain_v2.parquet
era5_store: /home/maitreje/dsw/data/raw/era5_europe_hourly_jja2023_med.zarr
dem: /home/maitreje/dsw/data/raw/srtm_tiles/
worldcover: /home/maitreje/dsw/data/raw/worldcover_esa/

# ── Frozen surrogate v2 ──────────────────────────────────────────────────────
surrogate_checkpoint: /home/maitreje/dsw/data/models/surrogate_v2_vit_base_resid_s4_geo_agl100_k24_surface/best.pt
surrogate_preset: base
norm_yaml: /scratch/maitreje/dsw/complex_terrain_v1/manifests/dataset_v2_norm.yaml
target_agl_levels: agl_0_100_24
n_pressure_levels: 10

# ── Splits (watertight, station-disjoint — SAME seed as M_I3) ────────────────
val_frac: 0.20
seed: 42
exclude_substrings: ["perdigao"]
max_stations: 40
max_train_pairings: 1200
max_val_pairings: 800

# ── ANN architecture (M_H'1g encoder — UNCHANGED vs M_I3) ─────────────────────
topo_dim: 12
enable_phys_features: true
hidden_units: [50, 10]
dropout: 0.25
use_terrain_encoder: true
terrain_latent_dim: 48
terrain_in_channels: 4

# ── Loss (M_I5b REGIME-AWARE) ────────────────────────────────────────────────
loss_mode: regime
tau_under: 0.6              # over-pred branch base τ (strong wind, unchanged)
tau_over: 0.4              # under-pred branch τ (preserves high-wind gain)
calm_threshold: 3.0       # below this obs speed → calm regime
calm_width: 1.5           # sigmoid softness of the calm gate
calm_over_penalty: 2.0    # over-pred τ scaled up to 2× in calm
weight_floor: 1.0         # floor MSE weight so calm errors are visible
calm_strat_thr: 3.0       # val low/high stratification threshold

# ── Training ─────────────────────────────────────────────────────────────────
epochs: 1
batch_size: 4
lr: 5.0e-4
grad_clip_norm: 1.0
num_workers: 2
n_prep_workers: 8
max_era5_delta_h: 3.5
overwrite_cache: false            # REQUIRES pre-materialised production cache

# ── I/O ──────────────────────────────────────────────────────────────────────
output_dir: /home/maitreje/dsw/data/models/surrogate_v2_devine_M_I5_encoder_smoke
cache_dir: /scratch/maitreje/dsw/phase_H_prime_M_I3_combined_cache
device: cuda
